name: TDR regression

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tdr-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Dependency audit (high+, production deps)
        run: npm audit --audit-level=high --omit=dev

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Security lint (API + Convex auth surfaces)
        run: npm run lint:security

      # Repo-wide `npm run lint` is deliberately NOT a gate. It reports 390
      # errors, 153 of them in src/convex — 74 unescaped apostrophes in guide
      # copy, 52 no-explicit-any, 17 set-state-in-effect. None are security
      # issues, and gating on them would block every PR on marketing punctuation.
      # lint:security above is the gate; repo-wide lint is a cleanup backlog.

      # Nine root-level test files were covered by no npm script, so CI never
      # ran them — including the tenant-isolation, filing-lock and
      # duplicate-filing guards. test:unit closes that.
      - name: Unit tests (access, filing guards, error surface)
        run: npm run test:unit

      - name: H1 unit tests + golden XML
        run: npm run test:h1

      - name: B1 export declaration regressions
        run: npm run test:b1

      - name: C1 simplified export regressions
        run: npm run test:c1

      - name: I1 simplified import regressions
        run: npm run test:i1

      - name: HMRC supporting evidence regressions
        run: npm run test:evidence

      - name: TRE regressions
        run: npm run test:tre

      - name: CNS inventory-linked regressions
        run: npm run test:cns

      - name: Portal authorization and document-flow regressions
        run: npm run test:portal

      # tests/export-controls/ held 15 files that no npm script ran, the sanctions
      # pair included. The pipeline they cover had no gate at all.
      - name: Export-control regressions (control list, sanctions, draft pack, EUSU)
        run: npm run test:export-controls

      - name: Consultant integration regressions
        run: npm run test:consultant

      - name: TDR v1 dry-run preflight
        run: npm run test:tdr-dry-run
        env:
          # Presence-only check; dry-run makes no HMRC calls
          HMRC_CLIENT_ID: ci-placeholder

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
